<table class="table">

    <thead>

        <tr>

            @for(column of model().columns; track column.field){

                <th>

                    {{ column.header }}

                </th>

            }

        </tr>

    </thead>

    <tbody>

        @for(row of model().data; track $index){

            <tr>

                @for(column of model().columns; track column.field){

                    <td>

                        @switch(column.type){

                            @case('status'){

                                <app-status-chip
                                    [model]="getStatus(row, column.field)">
                                </app-status-chip>

                            }

                            @case('progress'){

                                <app-progress-bar
                                    [model]="getProgress(row, column.field)">
                                </app-progress-bar>

                            }

                            @case('avatar'){

                                <app-avatar
                                    [model]="getAvatar(row, column.field)">
                                </app-avatar>

                            }

                            @default{

                                {{ row[column.field] }}

                            }

                        }

                    </td>

                }

            </tr>

        }

    </tbody>

</table>
