<div class="stat-card">

    <div class="stat-card__header">

        <div>

            <span class="stat-card__title">

                {{ model().title }}

            </span>

        </div>

        <div class="stat-card__icon">

            <span class="material-symbols-rounded">

                {{ model().icon }}

            </span>

        </div>

    </div>

    <div class="stat-card__body">

        <span class="stat-card__value">

            {{ model().value }}

        </span>

    </div>

    @if(model().trend !== undefined){

        <div
            class="stat-card__footer"
            [class.stat-card__footer--positive]="positiveTrend()"
            [class.stat-card__footer--negative]="!positiveTrend()">

            <span class="material-symbols-rounded">

                {{ positiveTrend() ? 'trending_up' : 'trending_down' }}

            </span>

            <strong>

                {{ model().trend }}%

            </strong>

            @if(model().trendLabel){

                <small>

                    {{ model().trendLabel }}

                </small>

            }

        </div>

    }

</div>
