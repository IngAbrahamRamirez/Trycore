<div class="stat-card">

    <div class="stat-card__header">

        <span class="stat-card__title">

            {{ model().title }}

        </span>

        @if (model().icon) {

            <span class="material-symbols-rounded stat-card__icon">

                {{ model().icon }}

            </span>

        }

    </div>

    <div class="stat-card__value">

        {{ model().value }}

    </div>

    <div class="stat-card__description">

    &nbsp;

</div>

</div>
