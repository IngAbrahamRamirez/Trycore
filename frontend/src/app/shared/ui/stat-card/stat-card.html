<div class="stat-card">
  <div class="stat-card__header">
    <div class="stat-card__icon">
      <span class="material-symbols-rounded">
        {{ model().icon }}
      </span>
    </div>

    @if (model().trend) {
      <app-metric-trend
        [model]="{
          value: model().trend!,
        }"
      >
      </app-metric-trend>
    }
  </div>

  <div class="stat-card__body">
    <small>
      {{ model().label }}
    </small>

    <h2>
      {{ model().value }}
    </h2>
  </div>
</div>
