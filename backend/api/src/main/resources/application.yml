spring:
  application:
    name: project-management-api

  datasource:
    url: jdbc:postgresql://localhost:5432/project_management
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
      format-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
